# Generated from one common source: sources.json + custom/client-routing.json.
# UNIFIED ROUTING TEMPLATE, not a standalone connection profile.
# Same business rules/order/groups/fallbacks, with reviewed client differences:
# Clash keeps its non-CN UDP/443 guard; Surge uses native QUIC handling and two Wi-Fi DIRECT rules.
# Fill commented private IP / Wi-Fi placeholders locally, then uncomment those rules.
# No node endpoints/credentials/real SSIDs; disabled ad rules are omitted.
[Rule]
# TEMPLATE: tailscale-direct
# IP-CIDR,{{TAILSCALE_DIRECT_IPV4}}/32,DIRECT,no-resolve
DOMAIN,msmp.abchina.com.cn,REJECT
DOMAIN,api.ipify.org,Claude
DOMAIN,checkip.amazonaws.com,Claude
DOMAIN-SUFFIX,safeway.com,Claude
DOMAIN,ifconfig.me,Proxy
RULE-SET,https://raw.githubusercontent.com/easylifegoal/proxy-rules/main/Surge/claude_domain.list?v=classical-v1,Claude
# TEMPLATE: home-wifi
# SUBNET,SSID:{{HOME_WIFI_SSID}},DIRECT
DOMAIN-KEYWORD,n26,N26
DOMAIN-SUFFIX,nodeseek.com,Nodeseek
DOMAIN-KEYWORD,223789,Magpie-Proxy
DOMAIN-KEYWORD,023168,Magpie
RULE-SET,https://raw.githubusercontent.com/easylifegoal/proxy-rules/main/Surge/private_ip.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/easylifegoal/proxy-rules/main/Surge/private_domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/easylifegoal/proxy-rules/main/Surge/ai.list,AI
RULE-SET,https://raw.githubusercontent.com/easylifegoal/proxy-rules/main/Surge/paypal_domain.list,PayPal
RULE-SET,https://raw.githubusercontent.com/easylifegoal/proxy-rules/main/Surge/usbank.list,USBank
