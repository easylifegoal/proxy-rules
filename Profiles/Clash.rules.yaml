# Generated from one common source: sources.json + custom/client-routing.json.
# UNIFIED ROUTING TEMPLATE, not a standalone connection profile.
# Same common rules/order/groups/fallbacks; only Surge has two Wi-Fi DIRECT exceptions.
# Fill commented private IP / Wi-Fi placeholders locally, then uncomment those rules.
# No node endpoints/credentials/real SSIDs; disabled ad rules are omitted.
rules:
  # TEMPLATE: tailscale-direct
  # - "IP-CIDR,{{TAILSCALE_DIRECT_IPV4}}/32,DIRECT,no-resolve"
  - "AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,cn_domain),(RULE-SET,cn_ip)))))),REJECT"
  - "DOMAIN,msmp.abchina.com.cn,REJECT"
  - "DOMAIN,api.ipify.org,Claude"
  - "DOMAIN,checkip.amazonaws.com,Claude"
  - "DOMAIN-SUFFIX,safeway.com,Claude"
  - "DOMAIN,ifconfig.me,Proxy"
  - "RULE-SET,claude_domain,Claude"
  - "DOMAIN-KEYWORD,n26,N26"
  - "DOMAIN-SUFFIX,nodeseek.com,Nodeseek"
  - "DOMAIN-KEYWORD,223789,Magpie-Proxy"
  - "DOMAIN-KEYWORD,023168,Magpie"
  - "RULE-SET,private_ip,DIRECT,no-resolve"
  - "RULE-SET,private_domain,DIRECT"
  - "RULE-SET,ai,AI"
  - "RULE-SET,paypal_domain,PayPal"
  - "RULE-SET,usbank_domain,USBank"
  - "RULE-SET,github_domain,GitHub"
  - "RULE-SET,telegram_domain,Proxy"
  - "RULE-SET,telegram_ip,Proxy,no-resolve"
  - "RULE-SET,netflix_domain,Netflix"
  - "RULE-SET,netflix_ip,Netflix,no-resolve"
  - "RULE-SET,youtube_domain,GlobalMedia"
  - "RULE-SET,global_media_domain,GlobalMedia"
  - "RULE-SET,onedrive_domain,OneDrive"
  - "RULE-SET,google_domain,Google"
  - "RULE-SET,microsoft_domain,Microsoft"
  - "RULE-SET,apns,APNS"
  - "RULE-SET,apple_domain,Apple"
  - "RULE-SET,apple_ip,Apple,no-resolve"
  - "RULE-SET,geolocation-!cn,Proxy"
  - "RULE-SET,cn_domain,DIRECT"
  - "RULE-SET,cn_ip,DIRECT"
  - "DST-PORT,80,Final"
  - "DST-PORT,443,Final"
  - "DST-PORT,22,Final"
  - "MATCH,DIRECT"

# Fake-IP provider is for existing DNS references, not a routing rule.
rule-providers:
  "fakeipfilter_domain":
    type: "http"
    behavior: "domain"
    format: "mrs"
    interval: 86400
    path: "./providers/proxy-rules/fakeipfilter_domain.mrs"
    url: "https://raw.githubusercontent.com/easylifegoal/proxy-rules/main/Clash/fakeipfilter_domain.mrs"
